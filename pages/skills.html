        <!-- BAGIAN KIRI -->
        <section class="skills-information">

            <div class="skills-heading">

            <div class="skills-cards">

                <article class="skill-card soft-card">
                    <div class="skill-card-heading">
                        <div class="skill-icon soft-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>

                            </svg>
                        </div>

                        <div>
                            <h2>Soft Skills</h2>
                    
                        </div>
                    </div>

                    <ul class="skill-list soft-list">
                        <li>Kerja sama tim</li>
                        <li>Manajemen waktu</li>
                        <li>Tanggung jawab</li>
                    </ul>
                </article>

                <!-- HARD SKILLS -->
                <article class="skill-card hard-card">
                    <div class="skill-card-heading">
                        <div class="skill-icon hard-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <polyline points="8 17 3 12 8 7"/>
                                <polyline points="16 7 21 12 16 17"/>
                                <line x1="14" y1="4" x2="10" y2="20"/>
                            </svg>
                        </div>

                        <div>
                            <h2>Hard Skills</h2>

                    <ul class="skill-list hard-list">
                        <li>HTML &amp; CSS</li>
                        <li>PHP (CodeIgniter 4)</li>
                        <li>MySQL</li>
                        <li>Microsoft Office</li>
                    </ul>
                </article>

            </div>
        </section>
